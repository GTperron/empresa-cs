version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: empresa_cs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: empresa_cs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresa_cs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - empresa_network

  # PgAdmin para visualizar la BD (opcional pero recomendado)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: empresa_cs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@empresa.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - empresa_network

volumes:
  postgres_data:
    driver: local

networks:
  empresa_network:
    driver: bridge
