<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Alternar menú">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="titulo">Gestión de Inventario</span>
  <span class="spacer"></span>
  @if (usuario(); as u) {
    <span class="usuario">{{ u.nombre }} {{ u.apellido }}</span>
  }
  <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión" aria-label="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      @for (item of navItems; track item.ruta) {
        <a mat-list-item [routerLink]="item.ruta" routerLinkActive="activo">
          <mat-icon matListItemIcon>{{ item.icono }}</mat-icon>
          <span matListItemTitle>{{ item.etiqueta }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
